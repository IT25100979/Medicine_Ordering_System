server:
  port: 8080

spring:
  application:
    name: mediorder-backend
  datasource:
    url: jdbc:mysql://localhost:3306/mediorder_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # use 'validate' before tagging a release
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://YOUR_CLERK_FRONTEND_API/.well-known/jwks.json

clerk:
  frontend-api: YOUR_CLERK_FRONTEND_API

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
