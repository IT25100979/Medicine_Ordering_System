# ------------------------------------------------------------------------------
# Built-in defaults so `./mvnw spring-boot:run` works on a fresh clone.
#
# These have the LOWEST precedence: anything in your own (gitignored)
# src/main/resources/application.yml, environment variables or -D flags wins.
#
# Out of the box they point at the project's local MySQL started with
#   ./scripts/local-db.sh start      (port 3307, user mediorder)
# To use another MySQL, export DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD.
# ------------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
spring.application.name=online_pharmacy-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:medical_system_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:mediorder}
spring.datasource.password=${DB_PASSWORD:mediorder123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.demo-login.enabled=${ENABLE_DEMO_LOGIN:true}
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
